# Orquestación local / entorno simulado de despliegue.
#
#   cliente ──> gateway (nginx, :8082) ──> geolocation-service (N réplicas) ──> postgres
#
# Uso:
#   docker compose up -d --build                      # 2 réplicas (por defecto)
#   APP_REPLICAS=4 docker compose up -d               # escalar horizontalmente
#   docker compose up -d --scale geolocation-service=3
#
# Variables configurables (ver .env.example). Los valores por defecto son SOLO para desarrollo.

name: sanosysalvos

services:

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-geolocation_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    # Sin puertos publicados: la BD solo es accesible por la red interna "backend".
    # Para inspeccionarla: docker compose exec postgres psql -U postgres -d geolocation_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
        reservations:
          memory: 256M
          cpus: "0.25"

  geolocation-service:
    # En CI se usa la imagen publicada (tag = SHA del commit); en local se construye desde el Dockerfile
    image: ${APP_IMAGE:-sanosysalvos/geolocation-service:local}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-local}
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-geolocation_db}
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:-c2Fub3N5c2Fsdm9zLXNlY3JldC1rZXktcGFyYS1qd3QtMjAyNg==}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [backend]
    # Hardening del contenedor
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 40s
    deploy:
      # Escalabilidad horizontal: sin container_name ni puertos publicados, el gateway balancea entre réplicas
      replicas: ${APP_REPLICAS:-2}
      resources:
        limits:
          memory: 768M
          cpus: "1.0"
        reservations:
          memory: 384M
          cpus: "0.5"

  gateway:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-8082}:8080"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      geolocation-service:
        condition: service_healthy
    networks: [backend]
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"

networks:
  backend:

volumes:
  postgres_data:
