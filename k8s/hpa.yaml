# Escalado horizontal automático según uso de CPU y memoria (requiere metrics-server)
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: geolocation-service
  labels:
    app.kubernetes.io/name: geolocation-service
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: geolocation-service
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 2
          periodSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 300   # evita "flapping": espera 5 min antes de reducir
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
