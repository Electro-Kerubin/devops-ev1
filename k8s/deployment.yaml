apiVersion: apps/v1
kind: Deployment
metadata:
  name: geolocation-service
  labels:
    app.kubernetes.io/name: geolocation-service
    app.kubernetes.io/part-of: sanosysalvos
spec:
  replicas: 2                    # mínimo de alta disponibilidad; el HPA ajusta entre 2 y 6
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0          # despliegue sin caída: nunca baja de la capacidad actual
  selector:
    matchLabels:
      app.kubernetes.io/name: geolocation-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: geolocation-service
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      # Reparte las réplicas entre nodos para tolerar la caída de uno
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: geolocation-service
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.37
          command: ["sh", "-c", "until nc -z postgres 5432; do echo esperando-postgres; sleep 2; done"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 50m, memory: 32Mi }
      containers:
        - name: geolocation-service
          image: sanosysalvos/geolocation-service:latest   # kustomize lo reemplaza con el tag = SHA del commit
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8082
          envFrom:
            - configMapRef:
                name: geolocation-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: geolocation-secrets
                  key: DB_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: geolocation-secrets
                  key: JWT_SECRET
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          startupProbe:                  # da hasta 2 min para el arranque (Flyway + JPA)
            httpGet: { path: /actuator/health, port: http }
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:                # saca la réplica del Service si falla
            httpGet: { path: /actuator/health, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:                 # reinicia el contenedor si queda colgado
            httpGet: { path: /actuator/health, port: http }
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 768Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
