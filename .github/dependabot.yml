version: 2
updates:
  # Dependencias Maven (SCA continuo: PRs automáticos al aparecer parches de seguridad)
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    target-branch: develop
    labels: [dependencies]
    groups:
      spring-boot:
        patterns: ["org.springframework.boot*"]

  # Imágenes base del Dockerfile
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    target-branch: develop
    labels: [dependencies, docker]
    ignore:
      # Se permanece en Java 21 (LTS), alineado con java.version del pom.xml: solo parches y menores
      - dependency-name: "eclipse-temurin"
        update-types: ["version-update:semver-major"]
      - dependency-name: "maven"
        update-types: ["version-update:semver-major"]

  # Versiones de las acciones usadas en los workflows
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    target-branch: develop
    labels: [dependencies, ci]
    groups:
      github-actions:
        patterns: ["*"]
