name: CI/CD Pipeline

on:
  push:
    branches: [develop]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Compilar proyecto
        run: mvn clean compile

      - name: Ejecutar tests
        run: mvn test

      - name: Empaquetar (build jar)
        run: mvn package -DskipTests

  docker-build-push:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Login a DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build y push de imagen Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKERHUB_REPONAME }}:latest

  deploy-simulado:
    needs: docker-build-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Simular despliegue en entorno cloud
        run: |
          echo "=== Iniciando despliegue simulado ==="
          echo "Imagen a desplegar: ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKERHUB_REPONAME }}:latest"
          echo "Descargando imagen desde DockerHub..."
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKERHUB_REPONAME }}:latest
          echo "Levantando contenedor en entorno simulado..."
          docker run -d -p 8080:8080 --name microservicio-simulado ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKERHUB_REPONAME }}:latest
          sleep 5
          echo "Verificando estado del contenedor..."
          docker ps -f name=microservicio-simulado
          echo "=== Despliegue simulado completado con éxito ==="

      - name: Verificar salud del servicio (health check simulado)
        run: |
          echo "Esperando a que el servicio levante..."
          sleep 10
          curl -f http://localhost:8080/actuator/health || echo "Health check no disponible, pero el contenedor está corriendo"