# Balanceador de carga round-robin hacia las réplicas de geolocation-service.
# 127.0.0.11 es el DNS interno de Docker: resuelve el nombre del servicio a la IP de cada réplica.
server {
    listen 8080;
    resolver 127.0.0.11 valid=5s ipv6=off;

    location / {
        # Usar una variable fuerza la resolución DNS en cada petición (permite escalar sin reiniciar)
        set $upstream http://geolocation-service:8082;
        proxy_pass $upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }
}
